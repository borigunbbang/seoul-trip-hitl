# 톤다운된 가을(단풍) 테마. 색 이름은 trip/theme.py의 PALETTE와 맞춘다.

[theme]
base = "light"
primaryColor = "#A8462F"              # 단풍 (톤다운된 적갈색)
backgroundColor = "#F7F2EA"           # 한지 같은 따뜻한 미색
secondaryBackgroundColor = "#EFE6D8"  # 귀리색
textColor = "#3A2E28"                 # 짙은 밤색
borderColor = "#E2D5C1"
linkColor = "#8C3B26"
showWidgetBorder = true

font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
headingFont = "Gowun Batang:https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
baseRadius = "large"
buttonRadius = "full"

# 알림 상자 색 (st.error / st.warning / st.info / st.success)
redColor = "#A33A2B"
redBackgroundColor = "#F4E0D8"
redTextColor = "#8A2E21"
orangeColor = "#C27C3A"
orangeBackgroundColor = "#F6E6D2"
orangeTextColor = "#8A5420"
yellowColor = "#C9A23B"
yellowBackgroundColor = "#F5EDD2"
yellowTextColor = "#76591A"
blueColor = "#5E7480"
blueBackgroundColor = "#E3E8E6"
blueTextColor = "#3D5360"
greenColor = "#6F7D4E"
greenBackgroundColor = "#E7EAD8"
greenTextColor = "#4D5832"
grayColor = "#8A7F75"

dataframeHeaderBackgroundColor = "#EFE6D8"
dataframeBorderColor = "#E2D5C1"

[theme.sidebar]
backgroundColor = "#EEE3D1"
secondaryBackgroundColor = "#E6D8C2"
borderColor = "#DDCDB5"

[client]
toolbarMode = "minimal"   # 오른쪽 위 Deploy 버튼 숨김
